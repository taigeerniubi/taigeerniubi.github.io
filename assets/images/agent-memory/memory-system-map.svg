<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Memory 四层结构</title>
  <desc id="desc">系统规则、短期记忆、任务记忆、长期记忆和外部知识经过上下文组装器，形成模型本轮真正看到的工作上下文。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.label{font-size:19px;font-weight:700}.body{font-size:14px;fill:#475569}.small{font-size:13px;fill:#64748b}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Agent Memory：四层记忆，一次装配</text>
  <text x="60" y="92" class="sub">保存只是第一步；只有被选进 Working Context 的信息，模型才能在本轮使用。</text>

  <g filter="url(#shadow)"><rect x="60" y="150" width="230" height="130" rx="22" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/><text x="175" y="190" class="label" text-anchor="middle">系统规则</text><text x="175" y="220" class="body" text-anchor="middle">System Prompt · Skills</text><text x="175" y="246" class="small" text-anchor="middle">必须稳定生效</text></g>
  <g filter="url(#shadow)"><rect x="340" y="150" width="230" height="130" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="455" y="190" class="label" text-anchor="middle">短期记忆</text><text x="455" y="220" class="body" text-anchor="middle">最近消息 · 对话摘要</text><text x="455" y="246" class="small" text-anchor="middle">作用域：thread</text></g>
  <g filter="url(#shadow)"><rect x="630" y="150" width="230" height="130" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="745" y="190" class="label" text-anchor="middle">当前任务记忆</text><text x="745" y="220" class="body" text-anchor="middle">目标 · 进度 · 约束 · 待办</text><text x="745" y="246" class="small" text-anchor="middle">结构化、持续更新</text></g>
  <g filter="url(#shadow)"><rect x="910" y="150" width="230" height="130" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="1025" y="190" class="label" text-anchor="middle">长期记忆</text><text x="1025" y="220" class="body" text-anchor="middle">Semantic · Episodic</text><text x="1025" y="246" class="small" text-anchor="middle">作用域：user / project / agent</text></g>

  <path class="line" d="M175 280V365"/><path class="line" d="M455 280V365"/><path class="line" d="M745 280V365"/><path class="line" d="M1025 280V365"/>
  <g filter="url(#shadow)"><rect x="180" y="365" width="840" height="120" rx="26" fill="#fff" stroke="#7c8cf8" stroke-width="3"/><text x="600" y="410" class="label" text-anchor="middle">Context Assembler</text><text x="600" y="441" class="body" text-anchor="middle">过滤权限 → 判断意图 → 检索与重排 → 去重冲突 → 控制 token budget</text><text x="600" y="466" class="small" text-anchor="middle">目标：最小、充分、高信号的本轮上下文</text></g>

  <g filter="url(#shadow)"><rect x="80" y="555" width="250" height="105" rx="21" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="205" y="594" class="label" text-anchor="middle">外部知识 RAG</text><text x="205" y="624" class="body" text-anchor="middle">文档 · 数据库 · API</text><text x="205" y="647" class="small" text-anchor="middle">按问题即时查询</text></g>
  <path class="line" d="M330 608H470"/>
  <g filter="url(#shadow)"><rect x="470" y="535" width="430" height="145" rx="25" fill="#0f172a"/><text x="685" y="581" class="label" text-anchor="middle" style="fill:#fff">Working Context</text><text x="685" y="614" class="body" text-anchor="middle" style="fill:#cbd5e1">模型这一次真正能看到的信息</text><text x="685" y="642" class="small" text-anchor="middle" style="fill:#94a3b8">调用结束后不会自动成为长期记忆</text></g>
  <path class="line" d="M600 485V535"/>
  <path class="line" d="M900 608H1025"/>
  <g filter="url(#shadow)"><rect x="1025" y="555" width="115" height="105" rx="21" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="1082" y="596" class="label" text-anchor="middle">模型</text><text x="1082" y="626" class="body" text-anchor="middle">推理</text><text x="1082" y="648" class="body" text-anchor="middle">行动</text></g>
</svg>
