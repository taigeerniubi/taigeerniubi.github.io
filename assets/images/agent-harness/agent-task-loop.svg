<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">修复失败测试时的 Agent 执行循环</title>
  <desc id="desc">Harness 组装上下文，模型决定下一步。如果提出工具调用，则校验参数和权限、执行工具、回填结果并再次调用模型；如果未调用工具，则根据停止原因决定完成、续接或报告异常。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.edge{font-size:14px;font-weight:700;fill:#64748b}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">一次真实任务，Harness 到底做了什么？</text>
  <text x="60" y="92" class="sub">例子：读取失败信息 → 修改折扣函数 → 重新运行测试 → 根据证据决定是否结束。</text>

  <g filter="url(#shadow)"><rect x="60" y="160" width="210" height="92" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="165" y="197" class="label" text-anchor="middle">1　接收目标</text><text x="165" y="226" class="body" text-anchor="middle">“修复测试，改完再跑一次”</text></g>
  <g filter="url(#shadow)"><rect x="340" y="160" width="220" height="92" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="450" y="197" class="label" text-anchor="middle">2　组装上下文</text><text x="450" y="226" class="body" text-anchor="middle">目标、代码、历史、可用工具</text></g>
  <g filter="url(#shadow)"><rect x="630" y="160" width="220" height="92" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="740" y="197" class="label" text-anchor="middle">3　模型生成</text><text x="740" y="226" class="body" text-anchor="middle">回答，或提出工具调用</text></g>
  <g filter="url(#shadow)"><path d="M1010 140 L1125 206 L1010 272 L895 206 Z" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="1010" y="198" class="label" text-anchor="middle">请求工具？</text><text x="1010" y="224" class="body" text-anchor="middle">结合停止原因判断</text></g>

  <g filter="url(#shadow)"><rect x="800" y="350" width="210" height="92" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="905" y="387" class="label" text-anchor="middle">4　校验与授权</text><text x="905" y="416" class="body" text-anchor="middle">Schema、权限、沙箱边界</text></g>
  <g filter="url(#shadow)"><rect x="510" y="350" width="210" height="92" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="615" y="387" class="label" text-anchor="middle">5　执行工具</text><text x="615" y="416" class="body" text-anchor="middle">读文件、修改、运行测试</text></g>
  <g filter="url(#shadow)"><rect x="220" y="350" width="210" height="92" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="325" y="387" class="label" text-anchor="middle">6　回填结果</text><text x="325" y="416" class="body" text-anchor="middle">退出码、输出、错误与证据</text></g>

  <g filter="url(#shadow)"><rect x="850" y="560" width="280" height="94" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="990" y="598" class="label" text-anchor="middle">结束或交还控制权</text><text x="990" y="627" class="body" text-anchor="middle">完成 · 续接 · 取消 · 预算耗尽 · 异常</text></g>

  <path class="line" d="M270 206 H340"/><path class="line" d="M560 206 H630"/><path class="line" d="M850 206 H895"/>
  <path class="line" d="M1010 272 V325 Q1010 350 985 350"/><text x="1030" y="315" class="edge">是</text>
  <path class="line" d="M800 396 H720"/><path class="line" d="M510 396 H430"/>
  <path class="line" d="M325 350 V308 Q325 282 351 282 H714 Q740 282 740 252"/><text x="500" y="304" class="edge">结果成为下一轮上下文</text>
  <path class="line" d="M1125 206 Q1160 206 1160 250 V520 Q1160 560 1125 580"/><text x="1143" y="386" class="edge">否</text>
  <rect x="60" y="555" width="650" height="104" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="591" class="label">完成条件看证据，不看一句“已经修复”</text>
  <text x="90" y="621" class="body">例：补丁已应用 + 相关测试实际运行 + 退出码为 0 + 未完成事项已说明。</text>
  <text x="90" y="646" class="body">最大轮数、工具超时与总预算属于循环控制，不应交给模型自行遵守。</text>
</svg>
