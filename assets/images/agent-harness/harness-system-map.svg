<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harness 系统边界与核心职责</title>
  <desc id="desc">用户目标进入 Harness。Harness 组装上下文、调用模型、检查权限、执行工具并记录状态。Skills、Memory 与 MCP 为 Harness 提供按需能力。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.label{font-size:20px;font-weight:700}.body{font-size:15px;fill:#475569}.small{font-size:14px;fill:#64748b}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Agent Harness：系统边界与核心职责</text>
  <text x="60" y="92" class="sub">模型负责提出下一步；Harness 负责把判断接到真实环境，并控制上下文、权限与状态。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="270" width="170" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="145" y="315" class="label" text-anchor="middle">用户</text>
    <text x="145" y="345" class="body" text-anchor="middle">目标 · 补充信息</text>
    <text x="145" y="369" class="body" text-anchor="middle">审批 · 反馈</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="280" y="130" width="630" height="430" rx="28" fill="#ffffff" stroke="#7c8cf8" stroke-width="3"/>
    <rect x="280" y="130" width="630" height="62" rx="28" fill="#eef2ff"/>
    <path d="M280 166 Q280 192 306 192 H884 Q910 192 910 166" fill="#eef2ff"/>
    <text x="315" y="170" class="label">HARNESS 运行系统</text>

    <rect x="320" y="222" width="250" height="92" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="445" y="258" class="label" text-anchor="middle">上下文组装</text>
    <text x="445" y="286" class="body" text-anchor="middle">目标 · 历史 · 工具 · 相关记忆</text>

    <rect x="620" y="222" width="250" height="92" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="745" y="258" class="label" text-anchor="middle">循环控制器</text>
    <text x="745" y="286" class="body" text-anchor="middle">停止原因 · 预算 · 重试 · 取消</text>

    <rect x="320" y="350" width="250" height="92" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="445" y="386" class="label" text-anchor="middle">权限与沙箱</text>
    <text x="445" y="414" class="body" text-anchor="middle">授权检查 · 访问边界 · 人工介入</text>

    <rect x="620" y="350" width="250" height="92" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="745" y="386" class="label" text-anchor="middle">工具执行器</text>
    <text x="745" y="414" class="body" text-anchor="middle">执行动作 · 捕获输出 · 返回错误</text>

    <rect x="320" y="478" width="550" height="48" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="595" y="509" class="body" text-anchor="middle">状态与证据：调用 ID · 日志 · 检查点 · 产物位置 · 未完成事项</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="220" width="170" height="150" rx="22" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="1055" y="264" class="label" text-anchor="middle">模型</text>
    <text x="1055" y="296" class="body" text-anchor="middle">读取本轮上下文</text>
    <text x="1055" y="322" class="body" text-anchor="middle">生成回答或</text>
    <text x="1055" y="346" class="body" text-anchor="middle">提出工具调用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="420" width="170" height="112" rx="22" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="1055" y="463" class="label" text-anchor="middle">真实环境</text>
    <text x="1055" y="493" class="body" text-anchor="middle">文件 · 进程 · API</text>
    <text x="1055" y="517" class="body" text-anchor="middle">数据库 · 浏览器</text>
  </g>

  <path class="line" d="M230 310 H280"/><text x="255" y="297" class="small" text-anchor="middle">目标</text>
  <path class="line" d="M910 268 H970"/><text x="940" y="253" class="small" text-anchor="middle">请求</text>
  <path class="line" d="M970 327 H910"/><text x="940" y="350" class="small" text-anchor="middle">决策</text>
  <path class="line" d="M870 396 Q930 396 970 455"/><text x="923" y="407" class="small" text-anchor="middle">执行</text>
  <path class="line" d="M970 505 Q925 550 870 430"/><text x="920" y="533" class="small" text-anchor="middle">结果</text>

  <rect x="280" y="620" width="630" height="90" rx="22" fill="#0f172a"/>
  <text x="315" y="654" font-size="17" font-weight="700" style="fill:#ffffff">按需接入的能力与资料</text>
  <text x="315" y="687" font-size="15" style="fill:#cbd5e1">Tools（动作）　 Skills（工作方法）　 Memory（历史信息）　 MCP（Tools / Resources / Prompts）</text>
  <path class="line" d="M595 620 V560"/>
</svg>
