<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Agent 评测的三层评分</title>
  <desc id="desc">先检查最终结果，再检查安全和权限硬约束，最后评分过程与体验。基础设施故障单独标记为无效运行。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0f172a" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.num{font-size:30px;font-weight:800}.label{font-size:21px;font-weight:700}.body{font-size:15px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2.6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="690" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">判分顺序：先问做没做成，再问做得好不好</text>
  <text x="60" y="92" class="sub">硬门槛不能被平均分冲掉；主观评分也不能替代真实环境中的结果检查。</text>
  <g filter="url(#shadow)">
    <rect x="75" y="170" width="300" height="170" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="125" cy="220" r="27" fill="#10b981"/><text x="125" y="230" class="num" text-anchor="middle" style="fill:#fff">1</text>
    <text x="175" y="226" class="label">最终结果</text>
    <text x="110" y="272" class="body">测试是否通过？退款是否入账？</text>
    <text x="110" y="302" class="body">文件、数据库和真实产物是什么状态？</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="170" width="300" height="170" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>
    <circle cx="500" cy="220" r="27" fill="#f97316"/><text x="500" y="230" class="num" text-anchor="middle" style="fill:#fff">2</text>
    <text x="550" y="226" class="label">硬约束</text>
    <text x="485" y="272" class="body">是否越权、泄露数据、破坏其他功能？</text>
    <text x="485" y="302" class="body">关键项失败后，Trial 直接失败或复核。</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="825" y="170" width="300" height="170" rx="24" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="875" cy="220" r="27" fill="#0ea5e9"/><text x="875" y="230" class="num" text-anchor="middle" style="fill:#fff">3</text>
    <text x="925" y="226" class="label">过程与体验</text>
    <text x="860" y="272" class="body">轮数、成本、重试、表达和可维护性。</text>
    <text x="860" y="302" class="body">用于比较与诊断，可以给部分分。</text>
  </g>
  <path class="line" d="M375 255H450"/><path class="line" d="M750 255H825"/>
  <g filter="url(#shadow)">
    <rect x="145" y="440" width="910" height="135" rx="25" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="175" y="474" width="180" height="68" rx="18" fill="#dcfce7"/><text x="265" y="516" class="label" text-anchor="middle">PASS</text>
    <rect x="405" y="474" width="180" height="68" rx="18" fill="#fee2e2"/><text x="495" y="516" class="label" text-anchor="middle">FAIL</text>
    <rect x="635" y="474" width="180" height="68" rx="18" fill="#f1f5f9"/><text x="725" y="516" class="label" text-anchor="middle">INVALID</text>
    <text x="865" y="493" class="body">环境和评分器坏了：</text><text x="865" y="520" class="body">修复考场后重跑，</text><text x="865" y="547" class="body">不要算成 Agent 失败。</text>
  </g>
  <text x="600" y="630" class="sub" text-anchor="middle">推荐：结果与安全使用硬门槛；质量、效率和体验使用分项得分。</text>
</svg>
