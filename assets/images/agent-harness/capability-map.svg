<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tools、Skills、Memory 与 MCP 的关系</title>
  <desc id="desc">Tools 提供动作接口，Skills 提供任务方法，Memory 保存跨轮次或跨会话的信息，MCP 是连接外部 Tools、Resources 和 Prompts 的协议。Harness 选择并组织这些能力，模型在当前上下文中进行判断。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.label{font-size:21px;font-weight:700}.body{font-size:15px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Tools、Skills、Memory、MCP：不是四种“工具”</text>
  <text x="60" y="92" class="sub">它们分别解决动作、方法、历史和标准接入问题，最终都由 Harness 组织进当前执行循环。</text>

  <g filter="url(#shadow)"><rect x="60" y="150" width="235" height="155" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="90" y="191" class="label">Tools</text><text x="90" y="224" class="body">回答：能执行什么动作？</text><text x="90" y="255" class="body">读文件 · 运行测试 · 调 API</text><text x="90" y="281" class="body">由真实代码执行并返回结果</text></g>
  <g filter="url(#shadow)"><rect x="325" y="150" width="235" height="155" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="355" y="191" class="label">Skills</text><text x="355" y="224" class="body">回答：这类任务怎么做？</text><text x="355" y="255" class="body">指令 · 流程 · 脚本 · 模板</text><text x="355" y="281" class="body">按任务需要加载相关内容</text></g>
  <g filter="url(#shadow)"><rect x="590" y="150" width="235" height="155" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="620" y="191" class="label">Memory</text><text x="620" y="224" class="body">回答：过去什么仍值得用？</text><text x="620" y="255" class="body">事实 · 偏好 · 决策 · 会话摘要</text><text x="620" y="281" class="body">需要检索或注入才对模型可见</text></g>
  <g filter="url(#shadow)"><rect x="855" y="150" width="285" height="155" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="885" y="191" class="label">MCP</text><text x="885" y="224" class="body">回答：如何标准化连接外部能力？</text><text x="885" y="255" class="body">Tools · Resources · Prompts</text><text x="885" y="281" class="body">Host—Client—Server 协议</text></g>

  <g filter="url(#shadow)"><rect x="305" y="410" width="590" height="122" rx="28" fill="#ffffff" stroke="#7c8cf8" stroke-width="3"/><text x="600" y="455" class="label" text-anchor="middle">Harness：发现、选择、装载、授权、执行、记录</text><text x="600" y="489" class="body" text-anchor="middle">把与当前任务相关的能力和信息，组织进这一轮模型上下文与执行过程</text></g>
  <g filter="url(#shadow)"><rect x="430" y="590" width="340" height="70" rx="22" fill="#0f172a"/><text x="600" y="633" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" style="fill:#ffffff" text-anchor="middle">模型：基于当前上下文判断下一步</text></g>

  <path class="line" d="M178 305 Q178 365 355 410"/><path class="line" d="M443 305 Q443 360 490 410"/><path class="line" d="M708 305 Q708 360 685 410"/><path class="line" d="M998 305 Q998 365 845 410"/><path class="line" d="M600 532 V590"/>
  <text x="60" y="365" class="sub">MCP 可以提供工具，也可以提供资源和提示模板；它不是 Memory 或 Skills 的统称。</text>
</svg>
