<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">一轮消息中的 Agent Memory 流程</title>
  <desc id="desc">用户消息进入在线读取路径，经作用域过滤、记忆检索、上下文组装和模型执行得到回复；随后异步提取、去重、合并并更新长期记忆。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.small{font-size:13px;fill:#64748b}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}.async{fill:none;stroke:#8b5cf6;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">一轮消息：读取在线，整理异步</text>
  <text x="60" y="92" class="sub">先用小而准的 Context 完成回答，再把记忆提取、冲突处理和索引更新移到后台。</text>

  <rect x="50" y="130" width="1100" height="270" rx="28" fill="#fff" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="82" y="169" class="label">在线路径 · 面向响应延迟</text>
  <g filter="url(#shadow)"><rect x="80" y="220" width="165" height="100" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="162" y="260" class="label" text-anchor="middle">新 Message</text><text x="162" y="289" class="body" text-anchor="middle">意图 · 实体 · 作用域</text></g>
  <g filter="url(#shadow)"><rect x="290" y="220" width="185" height="100" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="382" y="260" class="label" text-anchor="middle">硬过滤</text><text x="382" y="289" class="body" text-anchor="middle">用户 · 项目 · 权限 · 时间</text></g>
  <g filter="url(#shadow)"><rect x="520" y="205" width="190" height="130" rx="21" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="615" y="246" class="label" text-anchor="middle">混合检索</text><text x="615" y="275" class="body" text-anchor="middle">BM25 + Vector</text><text x="615" y="300" class="body" text-anchor="middle">Rerank + 去重</text><text x="615" y="322" class="small" text-anchor="middle">只取少量高价值记录</text></g>
  <g filter="url(#shadow)"><rect x="755" y="220" width="175" height="100" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="842" y="260" class="label" text-anchor="middle">Context 装配</text><text x="842" y="289" class="body" text-anchor="middle">任务 · 摘要 · 最近消息</text></g>
  <g filter="url(#shadow)"><rect x="975" y="220" width="145" height="100" rx="20" fill="#0f172a"/><text x="1047" y="260" class="label" text-anchor="middle" style="fill:#fff">模型执行</text><text x="1047" y="289" class="body" text-anchor="middle" style="fill:#cbd5e1">回复 / 工具</text></g>
  <path class="line" d="M245 270H290"/><path class="line" d="M475 270H520"/><path class="line" d="M710 270H755"/><path class="line" d="M930 270H975"/>

  <rect x="50" y="450" width="1100" height="235" rx="28" fill="#fff" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="82" y="489" class="label">异步写回 · 面向记忆质量</text>
  <g filter="url(#shadow)"><rect x="100" y="540" width="190" height="95" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="195" y="578" class="label" text-anchor="middle">保存原始事件</text><text x="195" y="607" class="body" text-anchor="middle">Message · Tool Result</text></g>
  <g filter="url(#shadow)"><rect x="345" y="540" width="190" height="95" rx="20" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/><text x="440" y="578" class="label" text-anchor="middle">提取候选</text><text x="440" y="607" class="body" text-anchor="middle">事实 · 决策 · 经验</text></g>
  <g filter="url(#shadow)"><rect x="590" y="525" width="205" height="125" rx="21" fill="#fefce8" stroke="#eab308" stroke-width="2"/><text x="692" y="566" class="label" text-anchor="middle">判断与对账</text><text x="692" y="595" class="body" text-anchor="middle">值得记吗？已有吗？</text><text x="692" y="620" class="body" text-anchor="middle">冲突吗？过期吗？</text></g>
  <g filter="url(#shadow)"><rect x="850" y="540" width="240" height="95" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="970" y="578" class="label" text-anchor="middle">更新 Memory</text><text x="970" y="607" class="body" text-anchor="middle">新增 · 合并 · 失效 · 重建索引</text></g>
  <path class="async" d="M1047 320V415Q1047 435 1015 450"/>
  <path class="async" d="M290 588H345"/><path class="async" d="M535 588H590"/><path class="async" d="M795 588H850"/>
  <text x="1080" y="414" class="small" text-anchor="middle">回复后触发</text>
</svg>
