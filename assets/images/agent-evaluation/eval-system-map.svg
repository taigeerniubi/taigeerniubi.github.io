<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent 评测系统全景</title>
  <desc id="desc">Eval Harness 读取任务和固定配置，在隔离环境中运行 Agent 系统，保存轨迹和最终状态，交给多个评分器并生成报告。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0f172a" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.label{font-size:19px;font-weight:700}.body{font-size:14px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Agent 评测系统：运动员和考场要分开</text>
  <text x="60" y="92" class="sub">Agent Harness 负责完成任务；Eval Harness 负责准备环境、记录过程、判分和汇总。</text>

  <rect x="45" y="135" width="1110" height="535" rx="30" fill="#fff" stroke="#7c8cf8" stroke-width="3"/>
  <text x="80" y="176" class="label">EVAL HARNESS</text>

  <g filter="url(#shadow)"><rect x="80" y="215" width="210" height="115" rx="21" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="185" y="254" class="label" text-anchor="middle">任务合同</text><text x="185" y="282" class="body" text-anchor="middle">初始状态 · 目标 · 禁止事项</text><text x="185" y="306" class="body" text-anchor="middle">预算 · 参考解 · Grader</text></g>
  <g filter="url(#shadow)"><rect x="355" y="215" width="210" height="115" rx="21" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="460" y="254" class="label" text-anchor="middle">隔离考场</text><text x="460" y="282" class="body" text-anchor="middle">干净快照 · 固定依赖</text><text x="460" y="306" class="body" text-anchor="middle">超时 · 网络 · 资源限制</text></g>
  <g filter="url(#shadow)"><rect x="630" y="195" width="230" height="155" rx="23" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2.5"/><text x="745" y="235" class="label" text-anchor="middle">被测 Agent 系统</text><text x="745" y="266" class="body" text-anchor="middle">模型 + Agent Harness</text><text x="745" y="291" class="body" text-anchor="middle">提示词 + 工具 + 记忆</text><text x="745" y="316" class="body" text-anchor="middle">在规定预算内执行任务</text></g>
  <g filter="url(#shadow)"><rect x="925" y="215" width="190" height="115" rx="21" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1020" y="254" class="label" text-anchor="middle">保存证据</text><text x="1020" y="282" class="body" text-anchor="middle">Trace · 最终状态</text><text x="1020" y="306" class="body" text-anchor="middle">token · 成本 · 延迟</text></g>

  <path class="line" d="M290 272H355"/><path class="line" d="M565 272H630"/><path class="line" d="M860 272H925"/>

  <g filter="url(#shadow)"><rect x="145" y="445" width="220" height="105" rx="21" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="255" y="484" class="label" text-anchor="middle">程序评分</text><text x="255" y="514" class="body" text-anchor="middle">测试 · 状态 · 权限 · 文件差异</text></g>
  <g filter="url(#shadow)"><rect x="420" y="445" width="220" height="105" rx="21" fill="#fefce8" stroke="#eab308" stroke-width="2"/><text x="530" y="484" class="label" text-anchor="middle">模型评分</text><text x="530" y="514" class="body" text-anchor="middle">明确 Rubric 下的主观质量</text></g>
  <g filter="url(#shadow)"><rect x="695" y="445" width="220" height="105" rx="21" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/><text x="805" y="484" class="label" text-anchor="middle">人工校准</text><text x="805" y="514" class="body" text-anchor="middle">专家复核 · 分歧样本 · 高风险案例</text></g>
  <g filter="url(#shadow)"><rect x="970" y="435" width="145" height="125" rx="21" fill="#0f172a"/><text x="1042" y="477" class="label" text-anchor="middle" style="fill:#fff">评测报告</text><text x="1042" y="508" class="body" text-anchor="middle" style="fill:#cbd5e1">成功 · 稳定</text><text x="1042" y="532" class="body" text-anchor="middle" style="fill:#cbd5e1">安全 · 成本</text></g>

  <path class="line" d="M1020 330V392Q1020 420 990 435"/>
  <path class="line" d="M925 395H255V445"/><path class="line" d="M925 395H530V445"/><path class="line" d="M925 395H805V445"/>
  <path class="line" d="M365 498H970"/><path class="line" d="M640 498H970"/><path class="line" d="M915 498H970"/>
  <rect x="145" y="600" width="820" height="42" rx="12" fill="#eef2ff"/>
  <text x="555" y="627" class="body" text-anchor="middle">环境故障标记为 INVALID；Agent 未完成标记为 FAIL。二者必须分开统计。</text>
</svg>
