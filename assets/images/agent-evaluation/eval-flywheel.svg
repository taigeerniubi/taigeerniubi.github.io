<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agent 评测驱动的持续改进闭环</title>
  <desc id="desc">线上失败经过脱敏复现进入能力集，修复后验证回归集，通过后上线监控，稳定任务转为回归测试，新的失败继续进入循环。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0f172a" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2.7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">评测不是期末考试，而是一条持续改进流水线</text>
  <text x="60" y="92" class="sub">真实失败不断变成新任务；已经稳定解决的能力进入回归集，防止以后退步。</text>

  <g filter="url(#shadow)"><rect x="70" y="185" width="190" height="105" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="165" y="226" class="label" text-anchor="middle">发现真实失败</text><text x="165" y="258" class="body" text-anchor="middle">工单 · 监控 · 人工抽查</text></g>
  <g filter="url(#shadow)"><rect x="325" y="185" width="190" height="105" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="420" y="226" class="label" text-anchor="middle">脱敏并复现</text><text x="420" y="258" class="body" text-anchor="middle">固定输入、环境和证据</text></g>
  <g filter="url(#shadow)"><rect x="580" y="185" width="190" height="105" rx="22" fill="#fefce8" stroke="#eab308" stroke-width="2"/><text x="675" y="226" class="label" text-anchor="middle">进入能力集</text><text x="675" y="258" class="body" text-anchor="middle">先暴露问题，再定义目标</text></g>
  <g filter="url(#shadow)"><rect x="835" y="185" width="250" height="105" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="960" y="226" class="label" text-anchor="middle">修改 Agent 系统</text><text x="960" y="258" class="body" text-anchor="middle">模型 · 提示词 · 工具 · Harness</text></g>

  <g filter="url(#shadow)"><rect x="800" y="430" width="285" height="105" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="942" y="471" class="label" text-anchor="middle">同时验证回归集</text><text x="942" y="503" class="body" text-anchor="middle">新问题修好，旧能力不能退步</text></g>
  <g filter="url(#shadow)"><rect x="485" y="430" width="250" height="105" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="610" y="471" class="label" text-anchor="middle">上线并监控</text><text x="610" y="503" class="body" text-anchor="middle">生产指标 · 用户反馈 · A/B</text></g>
  <g filter="url(#shadow)"><rect x="170" y="430" width="250" height="105" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="295" y="471" class="label" text-anchor="middle">稳定后转为回归题</text><text x="295" y="503" class="body" text-anchor="middle">“现在会做”变成“以后也要会”</text></g>

  <path class="line" d="M260 237H325"/><path class="line" d="M515 237H580"/><path class="line" d="M770 237H835"/>
  <path class="line" d="M960 290V430"/><path class="line" d="M800 482H735"/><path class="line" d="M485 482H420"/>
  <path class="line" d="M170 482H115Q70 482 70 437V290"/>
  <rect x="385" y="595" width="430" height="48" rx="14" fill="#0f172a"/>
  <text x="600" y="626" class="body" text-anchor="middle" style="fill:#cbd5e1">每次迭代只改少量变量，否则分数变化无法归因。</text>
</svg>
